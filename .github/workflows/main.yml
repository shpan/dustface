name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Show schemes
        run: xcodebuild -list -project DustFace.xcodeproj
      - name: Build unsigned
        run: xcodebuild -project DustFace.xcodeproj -scheme DustFace -configuration Release -destination ‘generic/platform=iOS’ -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Pack ipa
        run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/DustFace.app Payload/ && zip -qr DustFace.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DustFace-ipa
          path: DustFace.ipa
